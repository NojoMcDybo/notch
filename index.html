<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notch</title>
    <link rel="stylesheet" href="/src/nojo/nojo-ui.css" />
    <!-- Symbole: <svg data-icon="name"> wird beim Start aus der Bibliothek ersetzt (src/nojo/nojo-icons.ts) -->
    <link rel="stylesheet" href="/src/compact.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Musik-Reaktion: fensterfuellende Leinwand hinter der Notch (music-react.ts) -->
    <canvas class="react" aria-hidden="true"></canvas>
    <div id="notch" data-state="idle" data-view="home">
      <i class="ear l"></i><i class="ear r"></i>
      <div class="shape">
        <div class="dock-hint"></div>
        <!-- kompakt: links Cover/Icon, rechts Pegel/Wert, in der Mitte Ladering/Antwort/Spielstand -->
        <div class="compact">
          <div class="c-lead"></div>
          <div class="c-mid"></div>
          <div class="c-trail"></div>
        </div>

        <!-- kurz beim Kopieren: Inhalt faellt in die Ablage -->
        <div class="clip-peek">
          <div class="cp-tray">
            <svg data-icon="tray"></svg>
            <div class="cp-item"></div>
            <b class="cp-dot"></b>
          </div>
          <div class="cp-body">
            <div class="cp-label">Zwischenablage</div>
            <div class="cp-text"></div>
          </div>
        </div>

        <!-- aufgeklappt -->
        <div class="expanded">
          <nav class="nav">
            <button class="tab" data-view="home" title="Jetzt">
              <svg data-icon="disc"></svg>
            </button>
            <button class="tab" data-view="tray" title="Ablage">
              <svg data-icon="tray"></svg>
              <b class="badge" hidden></b>
            </button>
            <button class="tab" data-view="timer" title="Timer">
              <svg data-icon="timer"></svg>
            </button>
            <span class="spacer"></span>
            <button class="icon-btn share-btn" title="iPhone: QR-Code zum Senden und Empfangen" hidden>
              <svg data-icon="phone"></svg>
            </button>
            <button class="icon-btn clear-tray" title="Ablage leeren (Dateien bleiben erhalten)" hidden>
              <svg data-icon="trash"></svg>
            </button>
            <button class="icon-btn settings-btn" title="Einstellungen (eigenes Fenster)">
              <svg data-icon="settings"></svg>
            </button>
            <button class="icon-btn mic-btn" title="Sprachassistent (Strg+Alt+Leertaste)">
              <svg data-icon="mic"></svg>
            </button>
            <span class="clock"></span>
          </nav>

          <!-- Live-Sport: neue Meldung direkt unter der Leiste (sport.ts) -->
          <div class="sport-banner" hidden></div>

          <!-- Sprachassistent -->
          <section class="voice" hidden>
            <div class="orb"><i></i></div>
            <div class="v-body">
              <div class="v-state"></div>
              <div class="v-text"></div>
            </div>
            <button class="pill v-setup" hidden>Schlüssel eintragen</button>
            <button class="icon-btn v-stop" title="Beenden">
              <svg data-icon="close"></svg>
            </button>
          </section>

          <!-- Jetzt: Musik + Activities -->
          <div class="view v-home">
            <section class="player" hidden>
              <button class="cover-btn" title="Player öffnen"><img class="cover" alt="" /></button>
              <div class="meta">
                <button class="title-btn" title="Player öffnen">
                  <div class="title"></div>
                  <div class="artist"></div>
                </button>
                <div class="slider seek" title="Spulen">
                  <div class="track"><div class="fill"></div></div>
                  <div class="thumb"></div>
                </div>
                <div class="times"><span class="t-pos">0:00</span><button class="src"></button><span class="t-dur"></span></div>
              </div>
              <div class="side">
                <div class="controls">
                  <button data-act="prev" title="Zurück">
                    <svg data-icon="track-prev"></svg>
                  </button>
                  <button data-act="toggle" class="play" title="Play/Pause">
                    <svg data-icon="play" class="i-play"></svg>
                    <svg data-icon="pause" class="i-pause"></svg>
                  </button>
                  <button data-act="next" title="Weiter">
                    <svg data-icon="track-next"></svg>
                  </button>
                </div>
                <div class="vol">
                  <button class="vol-btn" title="Ton aus/an">
                    <svg data-icon="volume"></svg>
                  </button>
                  <div class="slider volume" title="Lautstärke">
                    <div class="track"><div class="fill"></div></div>
                    <div class="thumb"></div>
                  </div>
                </div>
              </div>
            </section>

            <section class="idle-info" hidden>
              <div class="big-clock"></div>
              <div class="date"></div>
            </section>

            <section class="acts"></section>

            <!-- Live-Sport: Spielstand, Spielfeld mit Ballverlauf, Ticker -->
            <div class="sport-slot" hidden></div>
          </div>

          <!-- Ablage -->
          <div class="view v-tray">
            <!-- iPhone: QR-Code fuer die Browser-Seite (share.rs) -->
            <div class="share-qr n-liquid panel" hidden>
              <img class="sq-img" alt="QR-Code" />
              <div class="sq-body">
                <b>Mit der iPhone-Kamera scannen</b>
                <span class="sq-what"></span>
                <span class="sq-alt"></span>
                <small class="sq-url"></small>
              </div>
              <button class="icon-btn sq-x" title="Schließen">
                <svg data-icon="close"></svg>
              </button>
            </div>
            <div class="drop">
              <svg data-icon="download"></svg>
              <span>Dateien hierher ziehen</span>
            </div>
            <div class="files"></div>
            <div class="clips-wrap" hidden>
              <div class="clips-head"><span>Zwischenablage</span><button class="clips-clear" title="Verlauf leeren">Leeren</button></div>
              <div class="clips"></div>
            </div>
            <div class="file-bar" hidden>
              <div class="fb-name"></div>
              <div class="fb-prog"><span></span></div>
            </div>
          </div>

          <!-- Timer -->
          <div class="view v-timer">
            <div class="timer-pick"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
