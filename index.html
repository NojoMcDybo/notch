<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notch</title>
    <link rel="stylesheet" href="/src/compact.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="notch" data-state="idle" data-view="home">
      <i class="ear l"></i><i class="ear r"></i>
      <div class="shape">
        <div class="dock-hint"></div>
        <!-- kompakt: links Cover/Icon, rechts Pegel/Wert -->
        <div class="compact">
          <div class="c-lead"></div>
          <div class="c-trail"></div>
        </div>

        <!-- kurz beim Kopieren: Inhalt faellt in die Ablage -->
        <div class="clip-peek">
          <div class="cp-tray">
            <svg viewBox="0 0 24 24"><path d="M4 13.5 6.2 5.6A2 2 0 0 1 8.1 4h7.8a2 2 0 0 1 1.9 1.6L20 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2.1 0H9a3 3 0 0 0 6 0h2.9L16 6H8z" /></svg>
            <div class="cp-item"></div>
            <b class="cp-dot"></b>
          </div>
          <div class="cp-body">
            <div class="cp-label">Zwischenablage</div>
            <div class="cp-text"></div>
          </div>
        </div>

        <!-- aufgeklappt -->
        <div class="expanded">
          <nav class="nav">
            <button class="tab" data-view="home" title="Jetzt">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" /></svg>
            </button>
            <button class="tab" data-view="tray" title="Ablage">
              <svg viewBox="0 0 24 24"><path d="M4 13.5 6.2 5.6A2 2 0 0 1 8.1 4h7.8a2 2 0 0 1 1.9 1.6L20 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2.1 0H9a3 3 0 0 0 6 0h2.9L16 6H8z" /></svg>
              <b class="badge" hidden></b>
            </button>
            <button class="tab" data-view="timer" title="Timer">
              <svg viewBox="0 0 24 24"><path d="M10 2h4v2h-4zm2 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-1 2h2v4.6l2.7 1.6-1 1.7L11 15.7zM18.4 5.2l1.4-1.4 1.4 1.4-1.4 1.4z" /></svg>
            </button>
            <span class="spacer"></span>
            <button class="icon-btn clear-tray" title="Ablage leeren (Dateien bleiben erhalten)" hidden>
              <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" /></svg>
            </button>
            <button class="icon-btn settings-btn" title="Einstellungen (eigenes Fenster)">
              <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a5.8 5.8 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2z" /></svg>
            </button>
            <button class="icon-btn mic-btn" title="Sprachassistent (Strg+Alt+Leertaste)">
              <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12z" /></svg>
            </button>
            <span class="clock"></span>
          </nav>

          <!-- Sprachassistent -->
          <section class="voice" hidden>
            <div class="orb"><i></i></div>
            <div class="v-body">
              <div class="v-state"></div>
              <div class="v-text"></div>
            </div>
            <button class="pill v-setup" hidden>Schlüssel eintragen</button>
            <button class="icon-btn v-stop" title="Beenden">
              <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z" /></svg>
            </button>
          </section>

          <!-- Jetzt: Musik + Activities -->
          <div class="view v-home">
            <section class="player" hidden>
              <button class="cover-btn" title="Player öffnen"><img class="cover" alt="" /></button>
              <div class="meta">
                <button class="title-btn" title="Player öffnen">
                  <div class="title"></div>
                  <div class="artist"></div>
                </button>
                <div class="slider seek" title="Spulen">
                  <div class="track"><div class="fill"></div></div>
                  <div class="thumb"></div>
                </div>
                <div class="times"><span class="t-pos">0:00</span><button class="src"></button><span class="t-dur"></span></div>
              </div>
              <div class="side">
                <div class="controls">
                  <button data-act="prev" title="Zurück">
                    <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zM20 6v12L10.5 12z" /></svg>
                  </button>
                  <button data-act="toggle" class="play" title="Play/Pause">
                    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
                  </button>
                  <button data-act="next" title="Weiter">
                    <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM4 6v12l9.5-6z" /></svg>
                  </button>
                </div>
                <div class="vol">
                  <button class="vol-btn" title="Ton aus/an">
                    <svg viewBox="0 0 24 24"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" /><path class="w1" d="M15.5 9.2a4 4 0 0 1 0 5.6" /><path class="w2" d="M18 6.8a7.5 7.5 0 0 1 0 10.4" /><path class="mx" d="M16 9.5l5 5m0-5-5 5" /></svg>
                  </button>
                  <div class="slider volume" title="Lautstärke">
                    <div class="track"><div class="fill"></div></div>
                    <div class="thumb"></div>
                  </div>
                </div>
              </div>
            </section>

            <section class="idle-info" hidden>
              <div class="big-clock"></div>
              <div class="date"></div>
            </section>

            <section class="acts"></section>
          </div>

          <!-- Ablage -->
          <div class="view v-tray">
            <div class="drop">
              <svg viewBox="0 0 24 24"><path d="M12 3v10m0 0-4-4m4 4 4-4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>
              <span>Dateien hierher ziehen</span>
            </div>
            <div class="files"></div>
            <div class="clips-wrap" hidden>
              <div class="clips-head"><span>Zwischenablage</span><button class="clips-clear" title="Verlauf leeren">Leeren</button></div>
              <div class="clips"></div>
            </div>
            <div class="file-bar" hidden>
              <div class="fb-name"></div>
              <div class="fb-prog"><span></span></div>
            </div>
          </div>

          <!-- Timer -->
          <div class="view v-timer">
            <div class="timer-pick"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
