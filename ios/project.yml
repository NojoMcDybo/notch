# iPhone-Begleiter fuer die Notch. Das Xcode-Projekt entsteht daraus (XcodeGen), im CI: .github/workflows/iphone.yml
name: Notch
options:
  bundleIdPrefix: de.nojo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Notch:
    type: application
    platform: iOS
    sources:
      - Notch
      - Shared
    dependencies:
      - target: NotchShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nojo.notch.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Gruppe fuer die gemeinsame Kopplung mit der Teilen-Erweiterung (siehe PairingStore)
    entitlements:
      path: Notch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.nojo.notch
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Notch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Der PC spricht im Heim-WLAN HTTP (Port 53317) und HTTPS mit eigenem Zertifikat (Kamera, Port 53443)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Notch spricht im WLAN mit deinem PC (Dateien, Zwischenablage, Kamerabild).
        NSCameraUsageDescription: Für den QR-Code der Notch und wenn das iPhone als Webcam für den PC dient.
        NSPhotoLibraryAddUsageDescription: Fotos und Videos, die du am PC abholst, kommen in die Fotos-App.
        # Dateien vom PC liegen sichtbar in Dateien › Auf meinem iPhone › Notch
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  NotchShare:
    type: app-extension
    platform: iOS
    sources:
      - NotchShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nojo.notch.phone.share
        SKIP_INSTALL: "YES"
    entitlements:
      path: NotchShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.nojo.notch
    info:
      path: NotchShare-Info.plist
      properties:
        CFBundleDisplayName: Notch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Notch spricht im WLAN mit deinem PC.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
