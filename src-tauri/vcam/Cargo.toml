[package]
name = "notch-vcam"
version = "0.1.0"
edition = "2021"
description = "Virtuelle Kamera der Notch (Media Foundation, laeuft im Windows-Frame-Server)"

[features]
log = []

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_MediaFoundation",
  "Win32_Media_KernelStreaming",
]

# eigenstaendig bauen (die Notch ruft das aus build.rs mit eigenem Zielordner auf)
[workspace]

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
