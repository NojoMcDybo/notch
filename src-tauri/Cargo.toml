[package]
name = "notch"
version = "0.3.0"
description = "Notch - Dynamic-Island-artige Infoanzeige fuer Windows und macOS"
authors = ["Nojo"]
edition = "2021"

[lib]
name = "notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
image = "0.25"
ureq = { version = "3", features = ["json"] }
tauri-plugin-global-shortcut = "2"
arboard = "3"
tauri-plugin-updater = "2"
rustfft = "6"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_UI_Input_XboxController",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Media_Ocr",
  "Graphics_Imaging",
]

# macOS: Fensterebene, Zwischenablage, Schluesselbund, Fenster/Tasten (CoreGraphics), Bedienungshilfen (AX),
# Controller, Texterkennung (Vision), Systemton (cpal)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL", "NSDictionary", "NSValue", "NSProcessInfo", "NSError", "NSEnumerator", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSRunningApplication", "NSWorkspace", "NSApplication", "NSResponder"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber", "CFBase", "CFCGTypes", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGEvent", "CGEventTypes", "CGDirectDisplay", "CGRemoteOperation", "CGEventSource"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "AXUIElement", "AXError", "AXAttributeConstants", "AXActionConstants", "AXRoleConstants", "HIServices", "AXValue"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCExtendedGamepad", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerElement", "GCPhysicalInputProfile", "GCControllerAxisInput"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes"] }
# Systemton abgreifen (Musik-Reaktion, Pegel): Loopback ueber Core-Audio-Tap, ab macOS 14.6
cpal = "0.18"
security-framework = "3"
ring = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
