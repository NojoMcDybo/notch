# Baut den Windows-Installer und die Mac-App (.dmg, Intel + Apple Silicon) und haengt beides an ein GitHub Release.
# Ausloeser: Tag v<version> pushen (muss zur Version in tauri.conf.json passen),
# oder manuell unter Actions > Release > Run workflow (baut die aktuelle Version).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Version pruefen
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zur Version $version in tauri.conf.json"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: npm ci --include=dev
      # virtuelle Kamera (laeuft im Windows-Frame-Server): schlaegt hier etwas fehl, entsteht kein Release
      - name: Tests (virtuelle Kamera)
        run: cargo test --manifest-path src-tauri/vcam/Cargo.toml

      # Code-Signatur (SignPath Foundation), damit die Intelligente App-Steuerung von Windows Installer, notch.exe und
      # die Kamera-DLL zulaesst. Aktiv, sobald das Secret SIGNPATH_API_TOKEN gesetzt ist; sonst unsigniert wie bisher.
      # Reihenfolge: DLL (steckt in notch.exe) -> notch.exe (steckt im Installer) -> Installer. Einrichtung: docs/signieren.md
      - name: Signieren aktiv?
        id: sign
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $on = if ($env:SIGNPATH_API_TOKEN) { 'true' } else { 'false' }
          "on=$on" >> $env:GITHUB_OUTPUT
          if ($on -eq 'false') { Write-Host '::warning::SIGNPATH_API_TOKEN fehlt: Release wird nicht signiert (die Intelligente App-Steuerung blockiert es dann)' }

      - name: Bauen und verpacken (unsigniert)
        if: steps.sign.outputs.on != 'true'
        run: npx tauri build --bundles nsis
        env:
          # signiert das Update (.sig); den passenden oeffentlichen Schluessel prueft die App
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # 1) Kamera-DLL
      - name: Kamera-DLL bauen
        if: steps.sign.outputs.on == 'true'
        run: |
          cargo build --release --manifest-path src-tauri/vcam/Cargo.toml --target-dir vcam-target
          New-Item -ItemType Directory -Force signing/dll | Out-Null
          Copy-Item vcam-target/release/notch_vcam.dll signing/dll/
      - name: Kamera-DLL hochladen
        if: steps.sign.outputs.on == 'true'
        id: up-dll
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-dll
          path: signing/dll
      - name: Kamera-DLL signieren
        if: steps.sign.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'notch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG || 'windows' }}
          github-artifact-id: ${{ steps.up-dll.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/dll-signed

      # 2) notch.exe mit der signierten DLL
      - name: notch.exe bauen
        if: steps.sign.outputs.on == 'true'
        run: |
          $env:NOTCH_VCAM_DLL = (Resolve-Path signing/dll-signed/notch_vcam.dll).Path
          npx tauri build --no-bundle
          New-Item -ItemType Directory -Force signing/exe | Out-Null
          Copy-Item src-tauri/target/release/notch.exe signing/exe/
      - name: notch.exe hochladen
        if: steps.sign.outputs.on == 'true'
        id: up-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: signing/exe
      - name: notch.exe signieren
        if: steps.sign.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'notch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG || 'windows' }}
          github-artifact-id: ${{ steps.up-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/exe-signed

      # 3) Installer aus der signierten notch.exe
      - name: Installer verpacken
        if: steps.sign.outputs.on == 'true'
        run: |
          Copy-Item signing/exe-signed/notch.exe src-tauri/target/release/notch.exe -Force
          npx tauri bundle --bundles nsis
          New-Item -ItemType Directory -Force signing/setup | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe signing/setup/
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Installer hochladen
        if: steps.sign.outputs.on == 'true'
        id: up-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: signing/setup
      - name: Installer signieren
        if: steps.sign.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'notch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG || 'windows' }}
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/setup-signed
      - name: Signierten Installer uebernehmen, Update-Signatur neu, Signaturen pruefen
        if: steps.sign.outputs.on == 'true'
        run: |
          $setup = Get-ChildItem signing/setup-signed/*-setup.exe | Select-Object -First 1
          $dest = Join-Path src-tauri/target/release/bundle/nsis $setup.Name
          Copy-Item $setup.FullName $dest -Force
          # die Update-Signatur (.sig) muss zur signierten Datei passen
          Remove-Item "$dest.sig" -ErrorAction SilentlyContinue
          # direkt ueber node statt npx, damit das leere Passwort als leeres Argument ankommt
          node node_modules/@tauri-apps/cli/tauri.js signer sign --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "" $dest
          if (-not (Test-Path "$dest.sig")) { throw "Update-Signatur fehlt" }
          foreach ($f in @($dest, 'src-tauri/target/release/notch.exe', 'signing/dll-signed/notch_vcam.dll')) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne 'Valid') { throw "$f ist nicht gueltig signiert: $($s.StatusMessage)" }
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Release anlegen, Installer und latest.json hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $version = $env:TAG.TrimStart('v')
          # latest.json: die installierten Apps fragen .../releases/latest/download/latest.json ab
          @{
            version   = $version
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "Notch $version" --notes "Windows: Notch_…-setup.exe (x64). Mac: Notch_…_universal.dmg (Intel und Apple Silicon, ab macOS 11; beim ersten Start Systemeinstellungen › Datenschutz & Sicherheit › Dennoch öffnen). Notch meldet neue Versionen selbst.`n`nSHA-256 Windows: ``$hash``"
          }
          gh release upload $env:TAG $exe.FullName latest.json --clobber

  # Mac: laeuft nach Windows, weil dieser Job das Release und latest.json anlegt; ergaenzt dort die Mac-Eintraege.
  # Ad-hoc signiert (ohne Apple-Entwicklerkonto): macOS fragt beim ersten Start einmal nach.
  macos:
    needs: installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --include=dev
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: DMG und Update hochladen, latest.json um macOS ergaenzen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.installer.outputs.tag }}
        run: |
          set -euo pipefail
          b=src-tauri/target/universal-apple-darwin/release/bundle
          dmg=$(ls "$b"/dmg/*.dmg | head -1)
          tgz=$(ls "$b"/macos/*.app.tar.gz | head -1)
          # eindeutiger Name im Release (sonst hiesse es nur Notch.app.tar.gz)
          upd="Notch_${TAG#v}_universal.app.tar.gz"
          cp "$tgz" "$upd"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$upd"
          gh release download "$TAG" -p latest.json -O latest.json --clobber
          jq --arg s "$(cat "$tgz.sig")" --arg u "$url"             '.platforms["darwin-aarch64"] = {signature: $s, url: $u} | .platforms["darwin-x86_64"] = {signature: $s, url: $u}'             latest.json > latest.new && mv latest.new latest.json
          gh release upload "$TAG" "$dmg" "$upd" latest.json --clobber
          echo "SHA-256 Mac: $(shasum -a 256 "$dmg")"
