# Baut den Windows-Installer und die Mac-App (.dmg, Intel + Apple Silicon) und haengt beides an ein GitHub Release.
# Ausloeser: Tag v<version> pushen (muss zur Version in tauri.conf.json passen),
# oder manuell unter Actions > Release > Run workflow (baut die aktuelle Version).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Version pruefen
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zur Version $version in tauri.conf.json"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: npm ci --include=dev
      - run: npx tauri build --bundles nsis
        env:
          # signiert das Update (.sig); den passenden oeffentlichen Schluessel prueft die App
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Release anlegen, Installer und latest.json hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $version = $env:TAG.TrimStart('v')
          # latest.json: die installierten Apps fragen .../releases/latest/download/latest.json ab
          @{
            version   = $version
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "Notch $version" --notes "Windows: Notch_…-setup.exe (x64). Mac: Notch_…_universal.dmg (Intel und Apple Silicon, ab macOS 11; beim ersten Start Systemeinstellungen › Datenschutz & Sicherheit › Dennoch öffnen). Notch meldet neue Versionen selbst.`n`nSHA-256 Windows: ``$hash``"
          }
          gh release upload $env:TAG $exe.FullName latest.json --clobber

  # Mac: laeuft nach Windows, weil dieser Job das Release und latest.json anlegt; ergaenzt dort die Mac-Eintraege.
  # Ad-hoc signiert (ohne Apple-Entwicklerkonto): macOS fragt beim ersten Start einmal nach.
  macos:
    needs: installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --include=dev
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: DMG und Update hochladen, latest.json um macOS ergaenzen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.installer.outputs.tag }}
        run: |
          set -euo pipefail
          b=src-tauri/target/universal-apple-darwin/release/bundle
          dmg=$(ls "$b"/dmg/*.dmg | head -1)
          tgz=$(ls "$b"/macos/*.app.tar.gz | head -1)
          # eindeutiger Name im Release (sonst hiesse es nur Notch.app.tar.gz)
          upd="Notch_${TAG#v}_universal.app.tar.gz"
          cp "$tgz" "$upd"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$upd"
          gh release download "$TAG" -p latest.json -O latest.json --clobber
          jq --arg s "$(cat "$tgz.sig")" --arg u "$url"             '.platforms["darwin-aarch64"] = {signature: $s, url: $u} | .platforms["darwin-x86_64"] = {signature: $s, url: $u}'             latest.json > latest.new && mv latest.new latest.json
          gh release upload "$TAG" "$dmg" "$upd" latest.json --clobber
          echo "SHA-256 Mac: $(shasum -a 256 "$dmg")"
