# iPhone-Begleiter (ios/) als unsignierte Notch.ipa bauen, ohne Release. Die Datei liegt danach unten auf der Seite des
# Laufs unter "Artifacts". Signiert wird beim Installieren (iLoader / SideStore mit der eigenen Apple-ID).
name: iPhone-App bauen
on:
  push:
    branches: [iphone-app]
    paths:
      - ios/**
      - .github/workflows/iphone.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Archiv bauen (ohne Signatur)
        run: |
          xcodebuild archive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -project Notch.xcodeproj \
            -scheme Notch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Notch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: ipa packen
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Notch.xcarchive/Products/Applications/Notch.app" "$RUNNER_TEMP/ipa/Payload/"
          # Ad-hoc signieren (innen nach aussen), damit die App-Gruppe im Programm steht; iLoader/SideStore lesen sie dort aus
          APP="$RUNNER_TEMP/ipa/Payload/Notch.app"
          codesign --force --sign - --entitlements NotchShare.entitlements "$APP/PlugIns/NotchShare.appex"
          codesign --force --sign - --entitlements Notch.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/NotchShare.appex"
          codesign -d --entitlements - "$APP"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/Notch.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: notch-ipa
          path: Notch.ipa
          if-no-files-found: error
